# Configuracion de SonarCloud para el monorepo.
# La organizacion y la clave del proyecto no van aqui: salen de las variables de GitHub
# SONAR_ORGANIZATION y SONAR_PROJECT_KEY (ver ci.yml). El token es el secreto SONAR_TOKEN.
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Codigo y pruebas de los dos paquetes
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Carpetas generadas o de terceros
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Archivos sin logica que probar: el arranque del servidor, los scripts de linea de comandos
# (se cubren con las pruebas con base de datos real) y el punto de entrada del frontend
sonar.coverage.exclusions=backend/src/server.ts,backend/src/scripts/**,frontend/src/main.tsx,frontend/src/vite-env.d.ts

# Cobertura de cada job de CI (el ci.yml deja un lcov.info por carpeta)
sonar.javascript.lcov.reportPaths=cobertura/*/lcov.info

# Reglas de TypeScript con informacion de tipos
sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.json