# Servidor web del frontend: sirve la aplicacion, redirige HTTP a HTTPS y reenvia /api al backend.
# Los certificados (servidor.crt y servidor.key) se montan en /etc/nginx/certs desde el servidor.

upstream backend_api {
  server backend:3000;
}

# HTTP: solo la comprobacion de vida para Docker; todo lo demas pasa a HTTPS
server {
  listen 8080;
  server_name _;
  server_tokens off;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS
server {
  listen 8443 ssl;
  http2 on;
  server_name _;
  server_tokens off;

  ssl_certificate     /etc/nginx/certs/servidor.crt;
  ssl_certificate_key /etc/nginx/certs/servidor.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Margen para el archivo de importacion de la plantilla de personal
  client_max_body_size 10m;

  root /usr/share/nginx/html;

  # API: se envia solo la IP real de quien llama; el backend la lee con TRUST_PROXY=1
  location /api/ {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Comprobacion de vida del backend, usada por el monitoreo
  location = /salud {
    proxy_pass http://backend_api/salud;
  }

  # Archivos compilados con nombre unico (hash): se pueden guardar un ano
  location /assets/ {
    include /etc/nginx/seguridad.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # La aplicacion es de una sola pagina: cualquier ruta devuelve index.html, que nunca se guarda en cache
  location / {
    include /etc/nginx/seguridad.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
