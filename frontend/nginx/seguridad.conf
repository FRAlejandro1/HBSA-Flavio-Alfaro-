# Cabeceras de seguridad de los archivos de la aplicacion. Se incluye en cada location porque nginx
# no hereda add_header si la location define el suyo. La API envia sus propias cabeceras (Helmet).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# La aplicacion solo carga recursos de su propio origen: sin scripts ni estilos incrustados
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
